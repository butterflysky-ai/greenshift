# Generated by `greenshift init nextest --ci forgejo --accept-unisolated`:
# commit it as is. To pin another greenshift release, run init again with
# the new --release and --sha256, and --force.
#
# THIS WORKFLOW IS NOT ISOLATED. greenshift's durable-history design
# (docs/design/durable-history.md, "Forgejo capability gate") says:
#
#   Stock Forgejo runner v13.2.2 exports its automatic repository token to
#   every step as both GITHUB_TOKEN and FORGEJO_TOKEN. Stock Forgejo
#   v16.0.3/v17.0.2 grants that token write access outside fork pull
#   requests and ignores workflow permissions. persist-credentials:false or
#   only referencing the token in a publisher step does not make its test
#   job read-only.
#
#   Consequently no ordinary push-test Forgejo workflow is offered as
#   isolated.
#
# So the tests, and everything they build and run, can write this
# repository, refs/greenshift/history included, with the job's token.
# The jobs below are kept apart as on GitHub, so that only the pinned,
# checksummed greenshift publishes, and only for pushes to the default
# branch; but that limits what greenshift does, not what test code can
# do. No `permissions` are written: Forgejo ignores them, and they would
# claim otherwise.
#
# Forgejo's artifact and cache actions differ from GitHub's: the artifact
# steps use Forgejo's own forks, as stock v4 refuses to run here. Check a
# first run on your instance; missing history, cache or artifacts warn and
# never fail the job.
name: greenshift

on: [push, pull_request]

env:
  GREENSHIFT_RELEASE: v0.2.0
  GREENSHIFT_SHA256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  HISTORY_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  test:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned greenshift release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GREENSHIFT_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::GREENSHIFT_RELEASE is not a release tag (vX.Y.Z)"; exit 1; }
          [[ "$GREENSHIFT_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::GREENSHIFT_SHA256 is not a SHA-256 checksum"; exit 1; }
          bin="$RUNNER_TEMP/greenshift"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/paceheart/greenshift/releases/download/$GREENSHIFT_RELEASE/greenshift-$GREENSHIFT_RELEASE-x86_64-unknown-linux-musl" \
            --output "$bin.download"
          # Fail closed: only a binary matching the pinned checksum is installed.
          if ! printf '%s  %s\n' "$GREENSHIFT_SHA256" "$bin.download" | sha256sum --check --strict; then
            rm -f "$bin.download"
            echo "::error::greenshift $GREENSHIFT_RELEASE does not match the pinned SHA-256; not installed"
            exit 1
          fi
          chmod +x "$bin.download"
          mv "$bin.download" "$bin"
      - name: Resolve canonical cache key
        id: history
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: echo "key=$("$RUNNER_TEMP/greenshift" history cache-key --remote "$HISTORY_REMOTE")" >> "$GITHUB_OUTPUT"
      - name: Restore fast copy
        id: cache
        continue-on-error: true
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .greenshift/cache
          key: ${{ steps.history.outputs.key }}
      - name: Install Rust when the runner has none
        shell: bash
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null; then
            cargo --version
            exit 0
          fi
          # Forgejo's default runner image has no Rust: install it with rustup,
          # pinned by version and checksum. rustup then follows the repository's
          # rust-toolchain.toml, if it has one.
          init="$RUNNER_TEMP/rustup-init"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init" \
            --output "$init"
          if ! printf '%s  %s\n' "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55" "$init" | sha256sum --check --strict; then
            rm -f "$init"
            echo "::error::rustup-init 1.29.3 does not match its pinned SHA-256; not installed"
            exit 1
          fi
          chmod +x "$init"
          "$init" -y --no-modify-path --profile minimal
          rm -f "$init"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest --version 0.9.143
      - name: Run tests and export data
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/greenshift" run nextest --history-remote "$HISTORY_REMOTE" \
            --history-cache-dir .greenshift/cache --history-artifact .greenshift/publish.sqlite \
            --commit "$GITHUB_SHA" -- --no-fail-fast
      - name: Upload SQLite data only
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4: v4.3.1, GHES check disabled
        with:
          name: greenshift-history
          path: .greenshift/publish.sqlite
          if-no-files-found: warn
          retention-days: 1
      - name: Report cache degradation
        if: ${{ !cancelled() && steps.cache.outcome == 'failure' }}
        run: echo '::warning::⚠ History cache unavailable; canonical git history remains the source'

  publish:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: docker
    concurrency:
      group: greenshift-history-publish
      cancel-in-progress: false
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # A job of its own: no repository checkout or code supplied by the
      # test job. Not a token boundary on Forgejo (see the top).
      - name: Install pinned greenshift release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GREENSHIFT_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::GREENSHIFT_RELEASE is not a release tag (vX.Y.Z)"; exit 1; }
          [[ "$GREENSHIFT_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::GREENSHIFT_SHA256 is not a SHA-256 checksum"; exit 1; }
          bin="$RUNNER_TEMP/greenshift"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/paceheart/greenshift/releases/download/$GREENSHIFT_RELEASE/greenshift-$GREENSHIFT_RELEASE-x86_64-unknown-linux-musl" \
            --output "$bin.download"
          # Fail closed: only a binary matching the pinned checksum is installed.
          if ! printf '%s  %s\n' "$GREENSHIFT_SHA256" "$bin.download" | sha256sum --check --strict; then
            rm -f "$bin.download"
            echo "::error::greenshift $GREENSHIFT_RELEASE does not match the pinned SHA-256; not installed"
            exit 1
          fi
          chmod +x "$bin.download"
          mv "$bin.download" "$bin"
      - name: Download SQLite data
        id: artifact
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4: v4.1.4, GHES check disabled
        with:
          name: greenshift-history
          path: data
      - name: Validate, merge and publish
        id: save
        if: ${{ steps.artifact.outcome == 'success' }}
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: |
          oid=$("$RUNNER_TEMP/greenshift" history publish --remote "$HISTORY_REMOTE" \
            --db data/publish.sqlite --cache-dir .greenshift/cache --default-branch "$DEFAULT_BRANCH")
          if [[ "$oid" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "key=greenshift-history-$oid" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::⚠ History was not published; no cache copy will be saved'
          fi
      - name: Save fast copy
        id: cache
        if: ${{ steps.save.outputs.key != '' }}
        continue-on-error: true
        uses: https://data.forgejo.org/actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .greenshift/cache
          key: ${{ steps.save.outputs.key }}
      - name: Report cache degradation
        if: ${{ !cancelled() && steps.cache.outcome == 'failure' }}
        run: echo '::warning::⚠ History cache save failed; durable ref was published independently'
      - name: Report missing history artifact
        if: ${{ !cancelled() && steps.artifact.outcome == 'failure' }}
        run: echo '::warning::⚠ No history artifact available; keeping the canonical ref unchanged'
